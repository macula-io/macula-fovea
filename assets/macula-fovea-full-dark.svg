<?xml version="1.0" encoding="UTF-8"?>
<!-- Macula full logo, Fovea variant (dark theme). See macula-fovea-full-light.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 88" width="240" height="88">
  <!-- Icon: the fovea — the sharpest point of vision, inside the mesh -->
  <g transform="translate(4, 12) scale(0.64)">
    <!-- Subtle grid -->
    <g stroke="#38BDF8" stroke-width="0.5" opacity="0.08">
      <line x1="0" y1="25" x2="100" y2="25"/>
      <line x1="0" y1="50" x2="100" y2="50"/>
      <line x1="0" y1="75" x2="100" y2="75"/>
      <line x1="25" y1="0" x2="25" y2="100"/>
      <line x1="50" y1="0" x2="50" y2="100"/>
      <line x1="75" y1="0" x2="75" y2="100"/>
    </g>
    <!-- Eye outline -->
    <g stroke="#38BDF8" stroke-width="2" fill="none">
      <path d="M10,50 Q50,18 90,50"/>
      <path d="M10,50 Q50,82 90,50"/>
    </g>
    <!-- Iris -->
    <circle cx="50" cy="50" r="20" stroke="#38BDF8" stroke-width="2" fill="#1E293B"/>
    <!-- Pupil -->
    <circle cx="50" cy="50" r="9" fill="#38BDF8"/>
    <!-- Fovea: the sharp point -->
    <circle cx="54" cy="46" r="3" fill="#FB923C"/>
    <!-- Retinal constellation -->
    <g stroke="#38BDF8" stroke-width="1.5" fill="#1E293B">
      <circle cx="22" cy="30" r="3"/>
      <circle cx="78" cy="30" r="3"/>
      <circle cx="22" cy="70" r="3"/>
      <circle cx="78" cy="70" r="3"/>
    </g>
    <g fill="#FB923C">
      <circle cx="22" cy="30" r="1.5"/>
      <circle cx="78" cy="30" r="1.5"/>
      <circle cx="22" cy="70" r="1.5"/>
      <circle cx="78" cy="70" r="1.5"/>
    </g>
    <g stroke="#38BDF8" stroke-width="1" opacity="0.45" fill="none">
      <line x1="22" y1="30" x2="38" y2="42"/>
      <line x1="78" y1="30" x2="62" y2="42"/>
      <line x1="22" y1="70" x2="38" y2="58"/>
      <line x1="78" y1="70" x2="62" y2="58"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="76" y="46"
        font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace"
        font-size="30"
        font-weight="600"
        fill="#38BDF8"
        letter-spacing="-0.5px">MACULA</text>
  <text x="77" y="68"
        font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace"
        font-size="15"
        font-weight="500"
        fill="#FB923C"
        letter-spacing="3px">FOVEA</text>

  <!-- Fovea badge -->
  <circle cx="54" cy="66" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <g transform="translate(42, 57)" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M1,9 Q12,0 23,9"/>
    <path d="M1,9 Q12,18 23,9"/>
  </g>
  <circle cx="54" cy="66" r="2.6" fill="#F8FAFC"/>
  <circle cx="56" cy="64.8" r="1" fill="#FB923C"/>
</svg>
