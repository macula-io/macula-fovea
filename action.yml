name: "macula-fovea"
description: >-
  Run the fovea security-assessment CLI (spec v0.2 to v0.6) against an assessment
  directory. Lint failures annotate the offending cell files in the PR diff;
  score and scorecard are written as artifacts and a job summary.
branding:
  icon: "eye"
  color: "blue"
inputs:
  dir:
    description: "Path to the assessment directory (containing fovea.yaml)."
    required: false
    default: "."
  command:
    description: "fovea subcommand to run: lint | score | render | issues"
    required: false
    default: "lint"
  args:
    description: "Extra fovea flags, e.g. --check or --dry-run for the issues command."
    required: false
    default: ""
  go-version:
    description: "Go toolchain version (matches .tool-versions)."
    required: false
    default: "1.27.0"
  artifact-dir:
    description: "Directory (relative to the workspace) for score.json and scorecard.md."
    required: false
    default: "fovea-artifacts"
runs:
  using: "composite"
  steps:
    # Every consumer run reports how old its pin of this Action is: a branch
    # or tag ref warns; a sha more than 14 days behind the newest release
    # warns and adds a job-summary line; an unknown answer is a notice. It
    # never fails the job. Contexts arrive through env only.
    - name: "Check this Action's pin"
      shell: bash
      env:
        FOVEA_ACTION_REF: ${{ github.action_ref }}
        FOVEA_ACTION_REPOSITORY: ${{ github.action_repository }}
        FOVEA_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/fovea-pin-self.sh"

    - name: "Setup Go ${{ inputs.go-version }}"
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        # The Action's go.sum lives under the action path, never in the
        # consumer's workspace, so setup-go's cache could only ever miss
        # (and warn). The build is small; no cache.
        cache: false

    # The binary's version is the ref this Action was pinned at (exported by
    # the pin check as FOVEA_RESOLVED_REF), "dev" for a local path. The log
    # then names the tool version and the spec versions it reads.
    - name: "Build fovea"
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/cli"
        go build -ldflags "-X main.version=${FOVEA_RESOLVED_REF:-dev}" -o "$RUNNER_TEMP/fovea" ./cmd/fovea
        "$RUNNER_TEMP/fovea" --version

    # Inputs reach bash only through env, never interpolated into the script:
    # an expression expanded inside run: is spliced in before bash parses it, so
    # an input like "$(curl evil)" would execute. From env it is plain data.
    - name: "Run fovea"
      shell: bash
      env:
        FOVEA_COMMAND: ${{ inputs.command }}
        FOVEA_DIR: ${{ inputs.dir }}
        FOVEA_ARGS: ${{ inputs.args }}
      run: |
        case "$FOVEA_COMMAND" in
          lint)   args=(--github) ;;
          score)  args=(--json) ;;
          render|issues) args=() ;;
          *) echo "::error title=fovea::unknown command '$FOVEA_COMMAND' (lint | score | render | issues)"; exit 2 ;;
        esac
        # Split extra args on whitespace only: no globbing, no substitution.
        read -r -a extra <<< "$FOVEA_ARGS"
        "$RUNNER_TEMP/fovea" "$FOVEA_COMMAND" "${args[@]}" "${extra[@]}" "$FOVEA_DIR"

    - name: "Write fovea artifacts"
      if: always()
      shell: bash
      env:
        FOVEA_DIR: ${{ inputs.dir }}
        FOVEA_ARTIFACT_DIR: ${{ inputs.artifact-dir }}
      run: |
        out="$GITHUB_WORKSPACE/$FOVEA_ARTIFACT_DIR"
        mkdir -p "$out"
        # Artifacts are produced even when lint fails: the report is exactly
        # what a red run should leave behind. Diagnostics go to stderr, so
        # score.json stays valid JSON on a failing run.
        set +e
        "$RUNNER_TEMP/fovea" score --json "$FOVEA_DIR" > "$out/score.json"
        "$RUNNER_TEMP/fovea" render "$FOVEA_DIR" > "$out/scorecard.md"
        "$RUNNER_TEMP/fovea" render --html "$FOVEA_DIR" > "$out/scorecard.html"
        set -e
        # Job summary gets the HTML rendering (emoji RAG badges); GitHub
        # renders tables and emoji there, which the markdown fence could not.
        cat "$out/scorecard.html" >> "$GITHUB_STEP_SUMMARY"
