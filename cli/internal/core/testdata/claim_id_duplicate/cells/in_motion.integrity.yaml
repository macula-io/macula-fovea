id: in_motion.integrity
status: assessed
owner: fixture@example.org
threat:
  definition: in_motion threatens integrity
  manifestations:
    - in_motion integrity observed
defense:
  detection:
    - measure: in_motion integrity monitored
      status: org
  countermeasures:
