# This exists so a change to the fovea lint cannot land unless it is
# formatted, vetted, race-tested against the rule cases, and builds.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go reads the whole ".tool-versions" line ("golang 1.27.0") as
      # the version, so the version is taken out of the file here instead;
      # .tool-versions stays the one place it is written.
      - name: Go version from .tool-versions
        working-directory: .
        run: |
          v="$(awk '$1 == "golang" { print $2 }' .tool-versions)"
          if [ -z "$v" ]; then
            echo "::error title=.tool-versions::no golang line"
            exit 1
          fi
          echo "GO_VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::not gofmt-clean: $unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: build
        run: go build -o fovea ./cmd/fovea

  # The repo's shell scripts and the invariants they guard.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pin guard sees .yml and .yaml
        run: scripts/test-check-pinned-actions.sh
      - name: every third-party action is pinned by sha
        run: scripts/check-pinned-actions.sh
      - name: pin staleness decisions (offline fixtures)
        run: scripts/test-fovea-pin-staleness.sh
      - name: release tag lookup (local fake API)
        run: scripts/test-fovea-pin-tags.sh
      - name: the Action step's ref discovery and failure handling
        run: scripts/test-fovea-pin-self.sh

  # Runs this repo's own action.yml end to end against the lint-clean
  # fixture. The dogfood assessment is deliberately not linted here.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          dir: cli/internal/core/testdata/valid_complete
          command: lint
      - name: score.json is valid JSON
        run: python3 -m json.tool fovea-artifacts/score.json > /dev/null
